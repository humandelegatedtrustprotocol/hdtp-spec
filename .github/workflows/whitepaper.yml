name: Build whitepaper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A gate and nothing more: the vectors, the references and schema examples, then the build. It holds no credential and keeps no
    # artifact. The whitepaper PDF is published by the maintainer, locally (`make publish`), and
    # served to registered readers by hdtp.io; a workflow artifact would hand it out.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The vectors open under this document's own rules, and no tracked path or text carries a name
      # the name guard forbids (scripts/check-names.mjs).
      - name: Vectors and names
        run: npm run vectors:check

      # Every section reference and relative link resolves, and the schema's reference page and examples
      # are what schema.json generates and accepts (scripts/check-refs.mjs, schema/reference.mjs, schema/examples.mjs).
      - name: References and schema examples
        run: npm run docs:check

      - name: Build
        run: npm run build
