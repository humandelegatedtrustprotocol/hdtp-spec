name: Build whitepaper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A gate and nothing more: the vectors, then the build. It holds no credential and keeps no
    # artifact. The whitepaper PDF is published by the maintainer, locally (`make publish`), and
    # served to registered readers by pact-protocol.com; a workflow artifact would hand it out.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The vectors open under this document's own rules, and no PACT 1.x name has come back
      # anywhere but the SPEC's refusal and the intrusion battery (vectors/check-no-1x.mjs).
      - name: Vectors and clearance
        run: npm run vectors:check

      - name: Build
        run: npm run build
