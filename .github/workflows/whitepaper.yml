name: Build whitepaper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Builds and checks only. Publishing is local and the owner's (`make publish`): no Cloudflare
    # credential is given to CI (the umbrella's standing rule 4).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The vectors open under this document's own rules, and no PACT 1.x name has come back
      # anywhere but the SPEC's refusal and the intrusion battery (vectors/check-no-1x.mjs).
      - name: Vectors and clearance
        run: npm run vectors:check

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pact-whitepaper
          path: dist/pact-whitepaper.pdf
          if-no-files-found: error

